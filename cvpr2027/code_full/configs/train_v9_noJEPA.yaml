_base_: base_21.yaml

# v9.0-noJEPA: load-bearing ablation per AH3/AH4/AH9 lock spec (2026-05-02).
# Same data/loss/schedule as v9.0, but V-JEPA backbone forward + cross-attn removed.

output_dir: /cache/zihaohe/checkpoint/runs/v9_noJEPA

precision: bf16

model:
  disable_vjepa: true              # ★ skip backbone build + forward entirely
  pixel_branch:
    dims: [64, 128, 256, 512, 1024]
    num_blocks: [4, 8, 8, 12, 16]
    heads: [4, 8, 8, 16, 16]
    ffn_exp: 2.66
    vjepa_layer_per_scale: [0, 0, 1, 2, 3]
    cross_attn_at_scales: []       # ★ no cross-attn since no V-JEPA features
    use_cfim_bottleneck: true
    use_illumination_cues: true
    use_gradient_checkpoint: true

train:
  batch_size: 2
  clip_len: 16
  crop_size: 256
  log_every: 50
  val_every: 500
  save_every: 2000
  keep_n_step_ckpts: 2
  ema_decay: 0.999
  ema_start: 1000
  val_window: 3

optim:
  lr: 2.0e-4                       # same as v9.0
  min_lr: 1.0e-5
  weight_decay: 1.0e-4
  betas: [0.9, 0.99]
  total_iters: 3000                # AH5: stage 1 = 3000, may extend to 7500
  warmup_iters: 250
  scheduler: cosine
  grad_clip: 1.0
  accum_steps: 4
  resume_from: null
  resume_reset_optim: false

data:                              # same as v9.0 (mixed indoor+outdoor per AH1)
  train:
    datasets:
      - kind: sdsd
        root: /home/ma-user/workspace/zihaohe/datasets/SDSD_indoor
        subset: direct
        split: train
        weight: 1.0
      - kind: sdsd
        root: /home/ma-user/workspace/zihaohe/datasets/SDSD_outdoor
        subset: direct
        split: train
        weight: 1.0
  val:
    kind: sdsd
    root: /home/ma-user/workspace/zihaohe/datasets/SDSD_indoor
    subset: direct
    split: test

loss:                              # same as v9.0
  pix_weight: 1.0
  lpips_weight: 0.1
  retinex_compose_weight: 0.5
  L_smooth_spatial_weight: 0.05
  L_smooth_temporal_weight: 0.10
  R_adjacent_weight: 0.05
  R_adjacent_scale: 2
  pred_dod_weight: 0.05
